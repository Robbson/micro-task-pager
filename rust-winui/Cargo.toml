[package]
name = "micro-task-pager-winui"
version = "1.5.1"
edition = "2024"
rust-version = "1.95"
publish = false

build = "build.rs"

[lib]
name = "micro_task_pager_winui"
path = "src/lib.rs"

[[bin]]
name = "micro-task-pager-winui"
path = "src/main.rs"

[dependencies]
# Shared, toolkit-independent platform code: COM, virtual desktops, window
# enumeration, settings, logging, single instance, monitor/foreground tracking,
# and the pure dialog helpers.
micro-task-pager-core = { path = "../crates/micro-task-pager-core" }
# The umbrella windows crate is still on 0.62; the focused Microsoft crates
# (registry and version) live in micro-task-pager-core.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-reactor = "0.100"

[lints.rust]
# Require an explicit unsafe block even inside an unsafe function, so every
# foreign call is visible at its use site.
unsafe_op_in_unsafe_fn = "deny"

[build-dependencies]
embed-resource = "3.0"
