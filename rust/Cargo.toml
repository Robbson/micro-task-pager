[package]
name = "micro-task-pager"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.95"

build = "build.rs"

[dependencies]
# The umbrella windows crate is still on 0.62; the focused Microsoft crates
# (registry, version, and reactor) use the 0.100 line.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-reactor = "0.100"
windows-registry = "0.100"
windows-version = "0.100"

[lints.rust]
# Require an explicit unsafe block even inside an unsafe function, so every
# foreign call is visible at its use site.
unsafe_op_in_unsafe_fn = "deny"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
