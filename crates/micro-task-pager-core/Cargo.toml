[package]
name = "micro-task-pager-core"
version = "1.5.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Only the Win32 surface the shared modules actually use. UI crates add their
# own features on top; Cargo features are additive, so the workspace ends up
# with the union of both lists.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.100"
windows-version = "0.100"

[lints.rust]
# Require an explicit unsafe block even inside an unsafe function, so every
# foreign call is visible at its use site.
unsafe_op_in_unsafe_fn = "deny"
