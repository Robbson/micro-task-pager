[package]
name = "micro-task-pager"
version = "1.5.1"
edition = "2024"
rust-version = "1.95"
publish = false

build = "build.rs"

[dependencies]
# The umbrella windows crate is still on 0.62; the focused Microsoft crates
# (registry, version, and the optional canvas) use the 0.100 line.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-registry = "0.100"
windows-version = "0.100"
# High-level, safe Win32 wrappers for the window host and the dialogs. The raw
# `windows` crate stays in use for the APIs winsafe does not wrap (GDI drawing,
# virtual-desktop COM, shell helpers).
winsafe = { version = "0.0.29", features = [
    "gui",
    "gdi",
    "user",
    "comctl",
    "dwm",
    "shell",
    "ole",
    "oleaut",
    "kernel",
] }
# Pure-Rust PNG decoding for the About logo. This replaces the WIC object
# plumbing and keeps the image as the original high-resolution PNG.
png = "0.18"

[lints.rust]
# Require an explicit unsafe block even inside an unsafe function, so every
# foreign call is visible at its use site.
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
